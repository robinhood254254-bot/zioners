<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#10100e">
  <title>Site under development</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10100e;
      color: #f7f4ed;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 35%, #282318 0, #10100e 65%);
    }

    main {
      width: min(100%, 620px);
      padding: clamp(32px, 8vw, 64px);
      text-align: center;
      border: 1px solid #ffffff20;
      border-radius: 20px;
      background: #171612cc;
      box-shadow: 0 24px 80px #0008;
    }

    .mark {
      display: inline-grid;
      width: 58px;
      height: 58px;
      place-items: center;
      margin-bottom: 24px;
      border: 1px solid #d8b66a80;
      border-radius: 50%;
      color: #e4c77f;
      font-size: 26px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    p {
      margin: 18px 0 0;
      color: #d2cec3;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .status {
      margin-top: 28px;
      color: #e4c77f;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Z</div>
    <h1>We’ll be back soon.</h1>
    <p>This site is currently under development. Please check back later.</p>
    <div class="status">Site under development</div>
  </main>
</body>
</html>
